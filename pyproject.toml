[project]
name = "ai-jarvis"
version = "2.0.0"
description = "Voice-first personal AI assistant for the desktop — OpenAI-compatible providers, built-in skills, local memory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Basanta Kumar Mohanty" }]
dependencies = [
    "python-dotenv>=1.0.0",
    "SpeechRecognition>=3.17.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "openai>=1.65.0",
    "customtkinter>=6.0.0",
    "Pillow>=10.0.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_jarvis"]
